<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel</title>
<style>
  :root {
    --face: #ece9d8;
    --edge-dark: #919b9c;
    --edge-light: #ffffff;
    --title-a: #0a246a;
    --title-b: #3a6ea5;
    --select: #316ac5;
    --text: #000;
    --muted: #555;
    --alert: #c00000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #3a6ea5;
    font: 11px Tahoma, "Segoe UI", Verdana, sans-serif;
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }

  /* ── Window ─────────────────────────────────────────── */
  .window {
    width: 100%;
    max-width: 1180px;
    background: var(--face);
    border: 1px solid #0831d9;
    border-radius: 7px 7px 0 0;
    box-shadow: 2px 2px 8px rgba(0,0,0,.35);
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    background: linear-gradient(to bottom, #0997ff 0%, #0053ee 8%, #0050ee 40%, #06f 88%, #005bff 100%);
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    padding: 5px 8px;
    border-radius: 6px 6px 0 0;
    text-shadow: 1px 1px #0f1089;
    display: flex;
    justify-content: space-between;
  }
  .titlebar .sub { font-weight: normal; opacity: .85; }

  /* ── Toolbar ────────────────────────────────────────── */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--edge-dark);
    box-shadow: 0 1px 0 var(--edge-light);
  }
  .sep { width: 1px; height: 20px; background: var(--edge-dark); box-shadow: 1px 0 0 var(--edge-light); margin: 0 4px; }
  button {
    font: inherit;
    min-width: 75px;
    padding: 3px 10px;
    border: 1px solid #003c74;
    border-radius: 3px;
    background: linear-gradient(to bottom, #fff, #ecebe6 85%, #d6d0c5);
    cursor: pointer;
  }
  button:hover:not(:disabled) { box-shadow: inset 0 0 0 2px #fbc761; }
  button:active:not(:disabled) { background: linear-gradient(to bottom, #e5e4de, #f2f1ec); }
  button:disabled { color: #aca899; border-color: #c9c7ba; cursor: default; }
  input[type=number] {
    font: inherit;
    width: 44px;
    padding: 2px 3px;
    border: 1px solid #7f9db9;
  }
  label { display: inline-flex; align-items: center; gap: 4px; }

  /* ── Body ───────────────────────────────────────────── */
  .body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 8px;
    padding: 8px;
  }
  @media (max-width: 860px) { .body { grid-template-columns: 1fr; } }

  .sunken {
    border: 1px solid;
    border-color: var(--edge-dark) var(--edge-light) var(--edge-light) var(--edge-dark);
    box-shadow: inset 1px 1px 0 #716f64;
  }
  .viewer {
    background: #000;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .viewer img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .viewer .empty { color: #bbb; text-align: center; line-height: 1.6; }

  fieldset {
    border: 1px solid #d0d0bf;
    border-radius: 3px;
    margin: 0 0 8px;
    padding: 6px 8px 8px;
  }
  legend { color: #0046d5; padding: 0 3px; }

  dl.props { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  dl.props dt { color: var(--muted); }
  dl.props dd { margin: 0; font-variant-numeric: tabular-nums; }

  .list {
    background: #fff;
    height: 300px;
    overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0;
    text-align: left;
    font-weight: normal;
    background: linear-gradient(to bottom, #fff, #ebeadb);
    border-right: 1px solid #c7c5b2;
    border-bottom: 1px solid #c7c5b2;
    padding: 3px 5px;
  }
  td { padding: 2px 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--select); color: #fff; }
  td.type { color: var(--alert); }
  tbody tr:hover td.type { color: #fff; }
  .list .none { color: var(--muted); padding: 8px; }

  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

  /* ── Status bar ─────────────────────────────────────── */
  .statusbar {
    display: flex;
    gap: 2px;
    padding: 2px;
    border-top: 1px solid var(--edge-light);
  }
  .statusbar span { padding: 2px 6px; flex: 0 0 auto; }
  .statusbar span:first-child { flex: 1 1 auto; }
</style>
</head>
<body>

<div class="window" role="application" aria-label="Sentinel">
  <div class="titlebar">
    <span>Sentinel</span>
    <span class="sub">Video anomaly detection</span>
  </div>

  <div class="toolbar">
    <input type="file" id="file" accept="video/*" hidden>
    <button id="btn-open">Open video…</button>
    <span class="sep"></span>
    <label for="cam">Camera</label>
    <input type="number" id="cam" min="0" value="0">
    <button id="btn-cam">Start camera</button>
    <span class="sep"></span>
    <button id="btn-stop" disabled>Stop</button>
  </div>

  <div class="body">
    <div class="viewer sunken">
      <img id="feed" alt="Annotated video stream">
      <div class="empty" id="empty">No source.<br>Open a video file or start a camera.</div>
    </div>

    <div>
      <fieldset>
        <legend>Status</legend>
        <dl class="props">
          <dt>Source</dt>         <dd id="s-source">—</dd>
          <dt>State</dt>          <dd id="s-state">Idle</dd>
          <dt>Detection</dt>      <dd id="s-model">—</dd>
          <dt>Frames</dt>         <dd id="s-frames">0</dd>
          <dt>Active tracks</dt>  <dd id="s-tracks">0</dd>
        </dl>
      </fieldset>

      <fieldset>
        <legend>Alerts</legend>
        <div class="list sunken">
          <table>
            <thead><tr><th>Time</th><th>Track</th><th>Type</th><th>Conf.</th></tr></thead>
            <tbody id="events"></tbody>
          </table>
          <div class="none" id="no-events">No alerts.</div>
        </div>
        <div class="row">
          <span id="counts">Running 0 · Loitering 0 · Fighting 0 · Other 0</span>
          <button id="btn-clear">Clear</button>
        </div>
      </fieldset>
    </div>
  </div>

  <div class="statusbar">
    <span class="sunken" id="msg">Ready</span>
    <span class="sunken" id="conn">Alerts: connecting…</span>
  </div>
</div>

<script>
const API = location.origin;
const $ = id => document.getElementById(id);

const MAX_ROWS = 200;
let events = [];          // newest first
let feedOn = false;

// ── Helpers ──────────────────────────────────────────────
function say(text) { $('msg').textContent = text; }

function fmtTime(ev) {
  const t = ev.timestamp ? new Date(ev.timestamp * 1000) : new Date();
  return t.toLocaleTimeString([], { hour12: false });
}

function titleCase(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

// ── Video feed ───────────────────────────────────────────
function showFeed(on) {
  if (on === feedOn) return;
  feedOn = on;
  const img = $('feed');
  if (on) {
    img.src = `${API}/api/stream?t=${Date.now()}`;
    img.style.display = 'block';
    $('empty').style.display = 'none';
  } else {
    img.removeAttribute('src');
    img.style.display = 'none';
    $('empty').style.display = '';
  }
  $('btn-stop').disabled = !on;
}

// ── Events ───────────────────────────────────────────────
function render() {
  const body = $('events');
  body.replaceChildren(...events.map(ev => {
    const tr = document.createElement('tr');
    const cells = [
      fmtTime(ev),
      `#${ev.track_id}`,
      titleCase(ev.anomaly_type || 'unknown'),
      `${Math.round((ev.confidence || 0) * 100)}%`,
    ];
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 2) td.className = 'type';
      tr.appendChild(td);
    });
    tr.title = `Frame ${ev.frame_number}` + (ev.rule_triggered ? ` · rule: ${ev.rule_triggered}` : '');
    return tr;
  }));
  $('no-events').style.display = events.length ? 'none' : '';

  const c = { running: 0, loitering: 0, fighting: 0, other: 0 };
  events.forEach(ev => {
    const k = ev.anomaly_type in c ? ev.anomaly_type : 'other';
    c[k]++;
  });
  $('counts').textContent =
    `Running ${c.running} · Loitering ${c.loitering} · Fighting ${c.fighting} · Other ${c.other}`;
}

function addEvent(ev) {
  events.unshift(ev);
  if (events.length > MAX_ROWS) events.length = MAX_ROWS;
  render();
}

async function loadEvents() {
  try {
    const res = await fetch(`${API}/api/events?limit=${MAX_ROWS}`);
    const data = await res.json();
    events = (data.events || []).slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    render();
  } catch { /* server not up yet */ }
}

// ── WebSocket (live alerts) ──────────────────────────────
let retry = 1000;
function connect() {
  const ws = new WebSocket(API.replace(/^http/, 'ws') + '/ws/alerts');
  ws.onopen = () => { retry = 1000; $('conn').textContent = 'Alerts: live'; };
  ws.onmessage = e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'ping') return;
    addEvent(ev);
  };
  ws.onclose = () => {
    $('conn').textContent = 'Alerts: reconnecting…';
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
}

// ── Status polling ───────────────────────────────────────
async function poll() {
  try {
    const s = await (await fetch(`${API}/api/status`)).json();
    $('s-source').textContent = s.source || '—';
    $('s-state').textContent  = s.running ? 'Processing' : 'Idle';
    $('s-model').textContent  = s.model_loaded ? 'LSTM + rules' : 'Rules only (no LSTM model)';
    $('s-frames').textContent = s.frame_count;
    $('s-tracks').textContent = s.track_count;
    showFeed(Boolean(s.running));
  } catch {
    $('s-state').textContent = 'Server unreachable';
  }
}

// ── Controls ─────────────────────────────────────────────
$('btn-open').onclick = () => $('file').click();

$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  say(`Uploading ${f.name}…`);
  try {
    const res = await fetch(`${API}/api/upload`, { method: 'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    say(`Processing ${f.name}`);
    showFeed(false); showFeed(true);
  } catch (err) {
    say(`Upload failed: ${err.message}`);
  }
  $('file').value = '';
};

$('btn-cam').onclick = async () => {
  const idx = parseInt($('cam').value, 10) || 0;
  try {
    await fetch(`${API}/api/stream/camera?index=${idx}`, { method: 'POST' });
    say(`Camera ${idx} started`);
    showFeed(false); showFeed(true);
  } catch { say('Could not start camera'); }
};

$('btn-stop').onclick = async () => {
  await fetch(`${API}/api/stop`, { method: 'POST' }).catch(() => {});
  showFeed(false);
  say('Stopped');
};

$('btn-clear').onclick = async () => {
  await fetch(`${API}/api/events`, { method: 'DELETE' }).catch(() => {});
  events = [];
  render();
};

// ── Init ─────────────────────────────────────────────────
render();
loadEvents();
connect();
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
